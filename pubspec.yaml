name: graph_coloring_advance_algo
description: "Graph Coloring Algorithm Visualization - Recursive, Backtracking & Greedy approaches"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/

  fonts:
    - family: CM
      fonts:
        - asset: assets/fonts/CM Sans Serif 2012.ttf
